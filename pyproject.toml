[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panelworks"
version = "0.7.0"
description = "Draw a desktop form in JSON, write event procedures in Python, and drive every object live over MCP (agents), MQTT (devices) and webhooks (n8n)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steve Spence (KK4HFJ)" }]
keywords = ["gui", "tkinter", "mcp", "mqtt", "n8n", "webhooks", "rad", "forms", "esp32", "home-automation", "serial", "arduino"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Home Automation",
]
dependencies = ["mcp>=1.10", "pyserial>=3.5"]

[project.urls]
Homepage = "https://kk4hfj.com"
Repository = "https://github.com/KK4HFJ/panelworks"
Documentation = "https://github.com/KK4HFJ/panelworks/blob/main/docs/manual/README.md"
Changelog = "https://github.com/KK4HFJ/panelworks/blob/main/CHANGELOG.md"
Issues = "https://github.com/KK4HFJ/panelworks/issues"
"OfficeNex" = "https://officenex.cloud"

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
modbus = ["pymodbus>=3.16,<4"]
snmp = ["pysnmp>=7.1,<8"]
pictures = ["pillow>=10"]
all = ["paho-mqtt>=2.0", "pymodbus>=3.16,<4", "pysnmp>=7.1,<8", "pillow>=10"]

[project.scripts]
panelworks = "panelworks.cli:main"
panelworks-designer = "panelworks.designer:main"
panelworks-make-exe = "panelworks.make_exe:main"

[tool.setuptools.packages.find]
include = ["panelworks*"]                  # panelworks/_examples/* too (staged for PyPI builds)

[tool.setuptools.package-data]
panelworks = ["assets/*.ico", "assets/*.png", "_examples/**/*"]
