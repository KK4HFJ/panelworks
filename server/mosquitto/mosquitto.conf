# Mosquitto for the PanelWorks test server.
# Mosquitto 2 only listens on localhost unless a listener is set, and refuses
# anonymous clients once a password file is in use.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
