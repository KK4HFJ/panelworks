# PanelWorks test server: Mosquitto, InfluxDB 2, Grafana, and optionally n8n, Node-RED and Ollama.
# Made for a Raspberry Pi 4/5 running a 64-bit OS, but any 64-bit Linux with Docker works.
#   ./setup.sh                      first time: makes .env, users and tokens, then starts it all
#   docker compose up -d            start     docker compose down     stop (data is kept)
#   ./setup.sh --profile nodered    add a part later (n8n, nodered, ai); setup.sh remembers it
# Optional parts are Compose profiles, listed in .env as COMPOSE_PROFILES=n8n,nodered
# Images are pinned to the versions the books were tested with. To update one, change its tag
# here, then: docker compose pull && docker compose up -d
# Settings and secrets come from .env, which setup.sh writes. Don't commit .env.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"            # MQTT
      - "9001:9001"            # MQTT over WebSockets
      - "8883:8883"            # MQTT over TLS, for boards on the LAN (setup.sh makes the certificates)
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    environment:
      TZ: ${TZ:-UTC}

  influxdb:
    image: influxdb:2          # stays on 2.x; "latest" is InfluxDB 3, which has no Flux
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      TZ: ${TZ:-UTC}
      # first start only: create the admin user, org, bucket and admin token
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?run ./setup.sh first}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-home}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-panelworks}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-0}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?run ./setup.sh first}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      TZ: ${TZ:-UTC}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run ./setup.sh first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # read by provisioning/datasources/influxdb.yml
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-panelworks}
      GRAFANA_INFLUX_TOKEN: ${GRAFANA_INFLUX_TOKEN:-}

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.7
    profiles: ["n8n"]          # COMPOSE_PROFILES=n8n in .env, or: ./setup.sh --profile n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      # encrypts saved credentials: setup.sh makes it once and never changes it. Lose it and
      # every credential in n8n has to be entered again. It's in .env: back that up.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}   # setup.sh sets this server's address
      N8N_SECURE_COOKIE: "false"   # lets you log in over plain http on your LAN
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5678/healthz',r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  nodered:
    image: nodered/node-red:4.1.17-22
    profiles: ["nodered"]      # COMPOSE_PROFILES=...,nodered, or: ./setup.sh --profile nodered
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    volumes:
      - nodered-data:/data
      - ./nodered/settings.js:/data/settings.js:ro
    environment:
      TZ: ${TZ:-UTC}
      NODERED_ADMIN_PASSWORD: ${NODERED_ADMIN_PASSWORD:-}   # editor login: admin / this
      # for flows: type ${MQTT_USER} etc. into a node's settings and Node-RED fills it in.
      # Inside Docker the other services are reached by name: mosquitto, influxdb.
      MQTT_HOST: mosquitto
      MQTT_USER: automation
      MQTT_PASS: ${MQTT_AUTOMATION_PASSWORD:-}
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-panelworks}
      INFLUX_TOKEN: ${NODERED_INFLUX_TOKEN:-}
      # the LLM: the ai profile's Ollama by default, or another machine (a Mac running Ollama
      # natively): put OLLAMA_URL=http://that-machine:11434 in .env
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}

  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ai"]           # a local LLM on the CPU. Needs RAM: try a 3-4B model on an 8 GB Pi
    restart: unless-stopped
    ports:
      - "11434:11434"          # no login: keep this server off the internet
    volumes:
      - ollama-data:/root/.ollama
    environment:
      TZ: ${TZ:-UTC}
      OLLAMA_KEEP_ALIVE: 30m   # keep the model loaded between questions

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  n8n-data:
  nodered-data:
  ollama-data:
