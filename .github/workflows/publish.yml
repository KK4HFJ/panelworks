# Publish to PyPI when a GitHub release is published (the n8n release form does that),
# or by hand from the Actions tab ("Run workflow") for the version on main.
#
# Uses PyPI trusted publishing: PyPI trusts this repository + this file + the "pypi"
# environment, so no API token is stored anywhere.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${{ github.event.release.tag_name }}"
          echo "pyproject $v, tag $tag"
          test "v$v" = "$tag"
      - name: Bundle the examples and pin README links
        run: python tools/prepare_dist.py "${{ github.event.release.tag_name || 'main' }}"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/panelworks/
    permissions:
      id-token: write          # lets PyPI verify this run came from this repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
